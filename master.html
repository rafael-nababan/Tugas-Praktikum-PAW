<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Event Baru</title>
    <style>
        :root {
            --bg: #F5F6F3;
            --panel: #FFFFFF;
            --ink: #1E2321;
            --muted: #6B726D;
            --line: #DEE2DD;
            --accent: #1c3e59;
            --accent-ink: #FFFFFF;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            padding: 48px 20px 64px;
        }
        .container { width: 100%; max-width: 560px; }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 28px;
            letter-spacing: -0.01em;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 32px;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            color: var(--ink);
            background: #FCFCFB;
            resize: vertical;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(28,62,89,0.15);
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B726D'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: var(--accent);
            color: var(--accent-ink);
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.92; }
        .status {
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
            color: var(--muted);
            min-height: 18px;
        }
        .status.ok { color: var(--accent); }
        .status.err { color: #B3261E; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tambah Event Baru</h1>

        <div class="panel">
            <form id="formEvent">
                <div class="form-group">
                    <label for="judul">Judul Event</label>
                    <input type="text" id="judul" name="judul" placeholder="Masukkan judul event" required>
                </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi</label>
                    <textarea id="deskripsi" name="deskripsi" rows="4" placeholder="Masukkan deskripsi event" required></textarea>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori" required>
                        <option value="" disabled selected>Pilih kategori</option>
                        <option value="teknologi">Teknologi</option>
                        <option value="bisnis">Bisnis</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="silabus">Silabus</label>
                    <textarea id="silabus" name="silabus" rows="4" placeholder="Masukkan silabus/materi event" required></textarea>
                </div>

                <div class="form-group">
                    <label for="durasi">Durasi Sesi (menit)</label>
                    <input type="number" id="durasi" name="durasi" min="1" placeholder="Contoh: 90" required>
                    <p class="hint">Durasi dalam satuan menit.</p>
                </div>

                <button type="submit">Simpan Event</button>
                <p class="status" id="status" role="status"></p>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'events';

        function loadEvents() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (err) {
                return [];
            }
        }

        document.getElementById('formEvent').addEventListener('submit', function (e) {
            e.preventDefault();
            const status = document.getElementById('status');
            status.className = 'status';

            const newEvent = {
                judul: document.getElementById('judul').value.trim(),
                deskripsi: document.getElementById('deskripsi').value.trim(),
                kategori: document.getElementById('kategori').value,
                silabus: document.getElementById('silabus').value.trim(),
                durasi: Number(document.getElementById('durasi').value)
            };

            try {
                const events = loadEvents();
                events.push(newEvent);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
                status.textContent = 'Event tersimpan. Total: ' + events.length + ' event.';
                status.classList.add('ok');
                this.reset();
            } catch (err) {
                status.textContent = 'Event gagal disimpan di browser.';
                status.classList.add('err');
            }
        });
    </script>
</body>
</html>
