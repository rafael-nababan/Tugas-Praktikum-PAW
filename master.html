<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Event Baru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tambah Event Baru</h1>

        <div class="panel">
            <form id="formEvent">
                <div class="form-group">
                    <label for="judul">Judul Event</label>
                    <input type="text" id="judul" name="judul" placeholder="Masukkan judul event" required>
                </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi</label>
                    <textarea id="deskripsi" name="deskripsi" rows="4" placeholder="Masukkan deskripsi event" required></textarea>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori" required>
                        <option value="" disabled selected>Pilih kategori</option>
                        <option value="teknologi">Teknologi</option>
                        <option value="bisnis">Bisnis</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="silabus">Silabus</label>
                    <textarea id="silabus" name="silabus" rows="4" placeholder="Masukkan silabus/materi event" required></textarea>
                </div>

                <div class="form-group">
                    <label for="durasi">Durasi Sesi (menit)</label>
                    <input type="number" id="durasi" name="durasi" min="1" placeholder="Contoh: 90" required>
                    <p class="hint">Durasi dalam satuan menit.</p>
                </div>

                <button type="submit">Simpan Event</button>
                <p class="status" id="status" role="status"></p>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'events';

        function loadEvents() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (err) {
                return [];
            }
        }

        document.getElementById('formEvent').addEventListener('submit', function (e) {
            e.preventDefault();
            const status = document.getElementById('status');
            status.className = 'status';

            const newEvent = {
                judul: document.getElementById('judul').value.trim(),
                deskripsi: document.getElementById('deskripsi').value.trim(),
                kategori: document.getElementById('kategori').value,
                silabus: document.getElementById('silabus').value.trim(),
                durasi: Number(document.getElementById('durasi').value)
            };

            try {
                const events = loadEvents();
                events.push(newEvent);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
                status.textContent = 'Event tersimpan. Total: ' + events.length + ' event.';
                status.classList.add('ok');
                this.reset();
            } catch (err) {
                status.textContent = 'Event gagal disimpan di browser.';
                status.classList.add('err');
            }
        });
    </script>
</body>
</html>
